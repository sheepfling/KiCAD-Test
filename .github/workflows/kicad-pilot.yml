name: KiCad pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kicad-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project-matrix:
    name: Build declared-project matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: matrix
        name: Resolve project-specific KiCad images
        run: echo "matrix=$(python3 tools/ci_matrix.py)" >> "$GITHUB_OUTPUT"
  python-tests:
    name: Checker unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lint declared projects, parts, interfaces, and libraries
        run: |
          mkdir -p build
          python3 tools/lint_registry.py --all --output build/governance-lint.json
      - name: Run checker unit tests
        run: python3 -m unittest discover -s tests -v
  kicad:
    name: KiCad ${{ matrix.project }} (${{ matrix.kicad_version }})
    needs: [project-matrix, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.project-matrix.outputs.matrix) }}
    env:
      KICAD_IMAGE: ${{ matrix.image }}
      PROJECT_ID: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record integration candidate and pinned image
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build
          echo "CHECKED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=$PR_HEAD" >> "$GITHUB_ENV"
          git status --porcelain=v1 > build/status-before.txt
          git rev-parse HEAD > build/checked-commit.txt
          git archive --format=tar.gz --output=build/checked-source.tar.gz HEAD
      - name: Pull digest-pinned official KiCad
        run: docker pull "$KICAD_IMAGE"
      - name: Check declared KiCad project
        id: baseline
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python3 \
            -e HOME=/tmp/kicad-pilot -e PYTHONDONTWRITEBYTECODE=1 \
            -e CHECKED_SHA -e PR_HEAD_SHA \
            -v "$PWD:/work" -w /work "$KICAD_IMAGE" \
            tools/check_all.py --project "$PROJECT_ID" --output build/review
      - name: Verify deliberate defects cannot pass
        if: matrix.project == 'controller' && steps.baseline.outcome == 'success'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python3 \
            -e HOME=/tmp/kicad-pilot -e PYTHONDONTWRITEBYTECODE=1 \
            -e CHECKED_SHA -e PR_HEAD_SHA \
            -v "$PWD:/work" -w /work "$KICAD_IMAGE" \
            tools/fault_probe.py --output build/fault-probes
      - name: Confirm tracked source remains unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain review and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kicad-review-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/
          if-no-files-found: error
          retention-days: 30
  engineering-gate:
    name: Engineering acceptance (synthetic pilot only)
    if: always()
    needs: [python-tests, kicad]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, skipped, missing or cancelled prerequisites
        env:
          UNIT_RESULT: ${{ needs.python-tests.result }}
          KICAD_RESULT: ${{ needs.kicad.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$KICAD_RESULT" = success
          echo "Synthetic checks executed successfully. NOT FOR MANUFACTURE."
