[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-team-template-policy"
version = "0.1.0"
description = "Typed policy and deterministic review tooling for the generic KiCad team template"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pyright==1.1.411",
  "ruff==0.16.1",
]

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["tools", "tests"]
extraPaths = ["."]
exclude = ["build"]
